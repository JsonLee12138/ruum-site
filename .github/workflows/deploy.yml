name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Rebuild daily at 04:00 UTC (12:00 CST) to sync new JsonLee12138/Ruum releases
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck, format & lint checks
        run: pnpm run check

      - name: Build static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://ruum.jsonlee12138.com' }}
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Pages credentials (CLOUDFLARE_API_TOKEN/CF_API_TOKEN and CLOUDFLARE_ACCOUNT_ID/CF_ACCOUNT_ID) not configured; skipping deploy."
            {
              echo "### Cloudflare Pages deployment skipped"
              echo ""
              echo "Build succeeded, but repository secrets for Cloudflare are not configured yet:"
              echo "- \`CLOUDFLARE_API_TOKEN\` (or \`CF_API_TOKEN\`) — token with **Cloudflare Pages: Edit** permission"
              echo "- \`CLOUDFLARE_ACCOUNT_ID\` (or \`CF_ACCOUNT_ID\`) — your Cloudflare Account ID"
              echo "- Optional variable \`CF_PAGES_PROJECT\` (defaults to \`ruum-site\`)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download dist artifact
        if: steps.cf.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Ensure Cloudflare Pages project exists
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT || 'ruum-site' }}
        run: npx --yes wrangler@latest pages project create "$PROJECT_NAME" --production-branch=main || true

      - name: Publish to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'ruum-site' }} --branch=${{ github.ref_name }}
